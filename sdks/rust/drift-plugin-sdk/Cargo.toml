[package]
name = "drift-plugin-sdk"
# Set by knope when a release is prepared; do not edit by hand.
version = "0.1.0"
description = "SDK for writing Drift plugins in Rust"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["drift", "plugin", "wasm", "component-model"]
categories = ["wasm", "development-tools"]
# The conformance test reads vectors from the repository root, which a published crate does not have.
exclude = ["tests/conformance.rs"]

[dependencies]
# The same minor Drift builds its plugins with.
wit-bindgen = "0.62"

[dev-dependencies]
serde_json = "1"
